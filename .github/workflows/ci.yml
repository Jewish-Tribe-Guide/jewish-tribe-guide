name: CI

# Runs the whole test suite automatically instead of relying on someone
# remembering to. `unit` needs no secrets (lint/typecheck/vitest are all pure
# — no network, no DB) so it always runs. `integration`, `cache-roundtrip`,
# `form-roundtrip`, `admin-write` and `e2e` each need their own Supabase
# project (see the `env:` block in each job for exactly which repo secrets to
# add, Settings → Secrets and variables → Actions, before they can pass) —
# `integration`, `cache-roundtrip`, `form-roundtrip`, `admin-write` and `e2e`
# all write to (or, for `e2e`, only read from) the SAME dedicated, disposable
# test project (see README "Integration tests").
#
# `e2e` used to point at the real production project instead — reasoning
# being it's read-only, so no harm done. In practice that made every PR's
# required check depend on production's CURRENT data/config, not just on the
# PR's own code: a branch that added new admin-configurable content (new
# home-screen card kinds) failed `e2e` in CI for weeks even though the code
# was correct, because production's `home_section` rows hadn't been migrated
# to match yet — and the fix that unblocked it was a manual production
# database write made specifically to satisfy CI, the reverse of this repo's
# own "deploy code first, then migrate content" order (see AGENTS.md
# "Ordering"). A required check's pass/fail should trace back to the PR's
# own code, not to a shared, mutable, externally-changing thing.
#
# `e2e-prod-smoke` is the same suite against the real production project,
# kept for the genuinely useful part of that idea — catching prod
# data/config drift — without making it a merge gate: it only runs on push
# to `main` (i.e. after a merge, not as part of one) and every step is
# `continue-on-error`, so a failure is visible in the Actions tab without
# blocking anything.
#
# Nothing waits on `unit` any more (Oct 19). The suites against the test
# project used to start only once lint, typecheck and the unit tests had
# passed, which put ~4.5 minutes in front of everything else; e2e then waited
# on cache-roundtrip and admin-write and ran for ~10 minutes alone, so a PR
# took ~20 minutes to go green. They all start at once now: a failing unit
# test no longer saves the other jobs' runner time, but this repo is public,
# so runner minutes are free, and a PR's author waits on the slowest path,
# not the total. e2e is sharded for the same reason (see its job).
#
# Every job below sets timeout-minutes, well above its normal run time (a
# few minutes) but far under GitHub's 360-minute default — nothing should
# silently eat a runner-hour (or make cancelling it someone's job to
# notice) if something does hang.
#
# `cache-roundtrip`, `form-roundtrip`, `admin-write` and `e2e` all drive a
# real browser, and used to run `npx playwright install --with-deps chromium` on the bare
# runner. That repeatedly hung for 20+ minutes, then 1+ hour, then hit the
# 15-minute timeout outright, always stuck in `apt-get update` endlessly
# retrying an unreachable azure.archive.ubuntu.com mirror before falling
# back to the real one — a GitHub-hosted-runner networking flake. They now
# run inside Playwright's own Docker image (browsers + OS deps
# preinstalled, version-matched to package.json's @playwright/test), so no
# apt-get ever runs in CI and that mirror can't be hit. Keep the image tag
# in sync with @playwright/test's version in package.json.
#
# One copy of each test-project suite at a time (Nov 20). The workflow-level
# `concurrency` below is per ref, so two branches' runs — or a PR's and
# main's — ran the same suite at the same moment against the one test
# project. Row claims (e2e/suiteRows.ts) keep DIFFERENT suites off each
# other's rows; they can't stop two copies of the SAME suite renaming the
# same fixture or minting the same admin's magic link, which is how PR 400's
# admin-write failed alongside main's on Nov 19. So each suite job queues in
# a repo-wide `test-db-<suite>` group (cancel-in-progress: false — wait,
# never kill). GitHub keeps one waiting job per group: if a third run
# arrives while one runs and one waits, the waiting one is cancelled, and
# that PR needs a re-run. Rare with one PR at a time; a re-run fixes it.
#
# And they don't run on push to main at all. main requires a branch to be
# up to date before merging, so the tree a push to main builds is the tree
# its PR already passed these suites on; running them again only doubled
# the collisions. `unit` still runs there, and `e2e-prod-smoke`.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration:
    name: Integration tests (real Supabase reads/writes)
    # See "One copy of each test-project suite at a time" above.
    if: github.event_name != 'push'
    concurrency:
      group: test-db-integration
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:integration
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

  cache-roundtrip:
    name: Cache round-trip (admin save reaches the cached page)
    # See "One copy of each test-project suite at a time" above.
    if: github.event_name != 'push'
    concurrency:
      group: test-db-cache-roundtrip
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-dist-dir: .next-e2e-3211
      # This job ran on a bare runner while every test here took only the
      # `request` fixture. That stopped being true when "an already-open tab
      # picks up an admin edit when it regains focus" was added — it takes
      # `page`, so it needs a real browser binary, and CI failed on
      # "Executable doesn't exist … run npx playwright install" while the
      # three request-only tests beside it passed.
      #
      # Fixed by putting it in the same image the other browser-driving jobs
      # use, rather than adding a `playwright install` step: installing on a
      # bare runner is the exact thing that used to hang for an hour in
      # apt-get (see the note at the top of this file).
      - run: npm run test:cache-roundtrip
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-cache
          path: playwright-report-cache/
          retention-days: 14

  form-roundtrip:
    name: Form submission (wizard reaches the database)
    # See "One copy of each test-project suite at a time" above.
    if: github.event_name != 'push'
    concurrency:
      group: test-db-form-roundtrip
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-dist-dir: .next-e2e-3212
      # Unlike cache-roundtrip, this suite drives a real browser (filling in
      # and submitting the wizard). Browsers + OS deps are already in the
      # container image, so no `playwright install` step is needed here.
      - run: npm run test:form-roundtrip
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-form
          path: playwright-report-form/
          retention-days: 14

  admin-write:
    name: Admin console write behavior (approve/reject via the real UI)
    # See "One copy of each test-project suite at a time" above.
    if: github.event_name != 'push'
    concurrency:
      group: test-db-admin-write
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    # Used to need cache-roundtrip too (not just unit): both suites'
    # auth.setup.ts minted a session by calling generateLink + verifyOtp
    # against the SAME resolved admin email, and a fresh magic-link token
    # invalidates whichever one was already outstanding for that user — so
    # when this job ran in parallel with cache-roundtrip, whichever setup's
    # verifyOtp lost the race failed with "Could not redeem the magic link:
    # Email link is invalid or has expired", reproducible basically every
    # run, not an occasional flake, since both jobs start at the same
    # instant. Same underlying class of bug as 03c2e99 (two suites colliding
    # on a shared row in the same test project), just on an auth token
    # instead of a row. Fixed at the source instead of by ordering: each
    # suite now mints its own distinct identity (ADMIN_WRITE_TEST_ADMIN_EMAIL
    # here, CACHE_TEST_ADMIN_EMAIL for cache-roundtrip — see
    # cacheE2eAdmin.mjs's own comment), so the two genuinely run in parallel
    # now and this job no longer needs to wait for cache-roundtrip first.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-dist-dir: .next-e2e-3213
      # Drives a real browser (clicking Approve/Reject in ModerationQueue),
      # same as form-roundtrip — no `playwright install` step needed, see
      # container image above.
      - run: npm run test:admin-write
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-admin-write
          path: playwright-report-admin-write/
          retention-days: 14

  e2e-build:
    name: Build for the end-to-end tests
    # The app, built once for every e2e shard, which start it rather than
    # each building their own (Nov 20): one artifact tested, not six
    # identical builds. The same container as the shards, so the build's
    # paths are the paths they run it at.
    #
    # Starts with everything else (Nov 20). It prerenders philly, and the
    # write suites change a community of their own, never philly (see
    # e2e's comment), so there is nothing of theirs for it to wait for.
    if: github.event_name != 'push'
    concurrency:
      group: test-db-e2e-build
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    # The shards reuse these (env: *e2e-env), so what they test is what
    # was built: NEXT_PUBLIC_ values are fixed into the build.
    env: &e2e-env
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      SUPERADMIN_EMAILS: ${{ secrets.SUPERADMIN_EMAILS }}
      INBOX_EMAILS: ${{ secrets.INBOX_EMAILS }}
      # Cloudflare's published always-passes Turnstile test key (not a
      # secret). Without any site key the widget renders nothing, so
      # e2e/budgets.spec.ts's "browsing loads nothing from Turnstile" check
      # could never fail in CI — it would skip. NEXT_PUBLIC_, so it has to be
      # present at build time.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # The site's own Maps key, so the desktop map is tested drawing a
      # real map (budgets.spec.ts, csp.spec.ts) rather than its "couldn't
      # load" message. NEXT_PUBLIC_, so it's in the page anyway; it's a
      # secret only to keep it out of the repo. Locally .env.local has it.
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-dist-dir: .next
      - run: npm run build
      # Not .next/cache: the shards only start the build, and it's the
      # setup action's cache, kept apart from the artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-build
          path: |
            .next/
            !.next/cache/
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: End-to-end tests (test project, ${{ matrix.shard }}/6)
    # See "One copy of each test-project suite at a time" above.
    if: github.event_name != 'push'
    concurrency:
      group: test-db-e2e-${{ matrix.shard }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    # Runs beside cache-roundtrip and admin-write, on the same test project.
    # It reads philly, the project's default community, and they change
    # `e2e-writes`, a hidden community of their own
    # (scripts/writeSuiteCommunity.mjs). Until Nov 20 they changed philly
    # too, so e2e (and its build, which prerenders philly) had to wait for
    # both to finish, and a PR's run was those two suites end to end. The
    # `page` rows (About, Privacy) belong to no community and are still
    # shared; e2e checks those pages' structure, never their words.
    # src/test/suiteRows.test.ts fails if a write suite claims a row in
    # philly or adds one with no community.
    #
    # Nor form-roundtrip: it only creates/deletes form and submission rows
    # (a seeded test form, its response), which nothing in e2e/ reads.
    #
    # Split six ways (four until Nov 20), each shard on its own runner
    # (Oct 19). Playwright splits by test count, not time, and a skipped
    # test counts, so four shards ran 150–208s of tests each; six, with the
    # build cached (see .github/actions/setup), cost one more cold start
    # each and take ~70s off the slowest. The suite runs
    # one test at a time per runner (playwright.config.ts's `workers` — a
    # 4-vCPU runner shared with the server and Chromium flaked with more),
    # so on one runner it took ~10 minutes, half of every PR's wait. Four
    # runners keep one worker each, so the per-runner contention that comment
    # describes is unchanged. Each shard starts the one build e2e-build
    # made (until Nov 20 each built its own, six identical builds a run) and
    # runs the `warmup` project first; Playwright puts a dependency project in
    # every shard whose tests need it. Public repo: the extra runners are free.
    needs: [e2e-build]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # The same settings the build had (the anchor on e2e-build): the
    # tests read the test project with them, and the server reads its
    # runtime ones.
    env: *e2e-env
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: e2e-build
          path: .next
      # Only the two engines the config actually uses (Desktop Chrome + Pixel 7
      # device emulation are both Chromium) — no `playwright install` step
      # needed, see container image above. It ships every engine, but we
      # only invoke Chromium via test:e2e.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/6
        env:
          E2E_PREBUILT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  e2e-prod-smoke:
    name: End-to-end tests (production, non-blocking)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No build cache: this build has production's values baked in, and
      # its cache would be main's, which every PR's e2e build restores from.
      - uses: ./.github/actions/setup
      - run: npm run test:e2e
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPERADMIN_EMAILS: ${{ secrets.SUPERADMIN_EMAILS }}
          INBOX_EMAILS: ${{ secrets.INBOX_EMAILS }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-prod-smoke
          path: playwright-report/
          retention-days: 14
