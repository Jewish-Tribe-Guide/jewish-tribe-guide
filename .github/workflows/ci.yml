name: CI

# Runs the whole test suite automatically instead of relying on someone
# remembering to. `unit` needs no secrets (lint/typecheck/vitest are all pure
# — no network, no DB) so it always runs. `integration`, `cache-roundtrip`,
# `form-roundtrip`, `admin-write` and `e2e` each need their own Supabase
# project (see the `env:` block in each job for exactly which repo secrets to
# add, Settings → Secrets and variables → Actions, before they can pass) —
# `integration`, `cache-roundtrip`, `form-roundtrip`, `admin-write` and `e2e`
# all write to (or, for `e2e`, only read from) the SAME dedicated, disposable
# test project (see README "Integration tests").
#
# `e2e` used to point at the real production project instead — reasoning
# being it's read-only, so no harm done. In practice that made every PR's
# required check depend on production's CURRENT data/config, not just on the
# PR's own code: a branch that added new admin-configurable content (new
# home-screen card kinds) failed `e2e` in CI for weeks even though the code
# was correct, because production's `home_section` rows hadn't been migrated
# to match yet — and the fix that unblocked it was a manual production
# database write made specifically to satisfy CI, the reverse of this repo's
# own "deploy code first, then migrate content" order (see AGENTS.md
# "Ordering"). A required check's pass/fail should trace back to the PR's
# own code, not to a shared, mutable, externally-changing thing.
#
# `e2e-prod-smoke` is the same suite against the real production project,
# kept for the genuinely useful part of that idea — catching prod
# data/config drift — without making it a merge gate: it only runs on push
# to `main` (i.e. after a merge, not as part of one) and every step is
# `continue-on-error`, so a failure is visible in the Actions tab without
# blocking anything.
#
# Every job below sets timeout-minutes, well above its normal run time (a
# few minutes) but far under GitHub's 360-minute default — nothing should
# silently eat a runner-hour (or make cancelling it someone's job to
# notice) if something does hang.
#
# `cache-roundtrip`, `form-roundtrip`, `admin-write` and `e2e` all drive a
# real browser, and used to run `npx playwright install --with-deps chromium` on the bare
# runner. That repeatedly hung for 20+ minutes, then 1+ hour, then hit the
# 15-minute timeout outright, always stuck in `apt-get update` endlessly
# retrying an unreachable azure.archive.ubuntu.com mirror before falling
# back to the real one — a GitHub-hosted-runner networking flake. They now
# run inside Playwright's own Docker image (browsers + OS deps
# preinstalled, version-matched to package.json's @playwright/test), so no
# apt-get ever runs in CI and that mirror can't be hit. Keep the image tag
# in sync with @playwright/test's version in package.json.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration:
    name: Integration tests (real Supabase reads/writes)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

  cache-roundtrip:
    name: Cache round-trip (admin save reaches the cached page)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # This job ran on a bare runner while every test here took only the
      # `request` fixture. That stopped being true when "an already-open tab
      # picks up an admin edit when it regains focus" was added — it takes
      # `page`, so it needs a real browser binary, and CI failed on
      # "Executable doesn't exist … run npx playwright install" while the
      # three request-only tests beside it passed.
      #
      # Fixed by putting it in the same image the other browser-driving jobs
      # use, rather than adding a `playwright install` step: installing on a
      # bare runner is the exact thing that used to hang for an hour in
      # apt-get (see the note at the top of this file).
      - run: npm run test:cache-roundtrip
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-cache
          path: playwright-report-cache/
          retention-days: 14

  form-roundtrip:
    name: Form submission (wizard reaches the database)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unlike cache-roundtrip, this suite drives a real browser (filling in
      # and submitting the wizard). Browsers + OS deps are already in the
      # container image, so no `playwright install` step is needed here.
      - run: npm run test:form-roundtrip
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-form
          path: playwright-report-form/
          retention-days: 14

  admin-write:
    name: Admin console write behavior (approve/reject via the real UI)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    # needs cache-roundtrip too (not just unit): both suites' auth.setup.ts
    # mint a session by calling generateLink + verifyOtp against the SAME
    # resolved admin email (see cacheE2eAdmin.mjs's resolveDefaultCommunityAdminEmail —
    # they have to share an identity to test per-community authorization for
    # real). Generating a new magic-link token for a user invalidates
    # whichever one was already outstanding for them, so when this job ran
    # in parallel with cache-roundtrip, whichever setup's verifyOtp lost the
    # race failed with "Could not redeem the magic link: Email link is
    # invalid or has expired" — reproducible basically every run, not an
    # occasional flake, since both jobs start at the same instant. Same
    # underlying class of bug as 03c2e99 (two suites colliding on a shared
    # row in the same test project), just on an auth token instead of a row;
    # running this job after cache-roundtrip removes the race the same way
    # separating the rows did there.
    needs: [unit, cache-roundtrip]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Drives a real browser (clicking Approve/Reject in ModerationQueue),
      # same as form-roundtrip — no `playwright install` step needed, see
      # container image above.
      - run: npm run test:admin-write
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-admin-write
          path: playwright-report-admin-write/
          retention-days: 14

  e2e:
    name: End-to-end tests (test project)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    # Needs the three write suites too, not just unit: they all share this
    # same TEST_SUPABASE_* project now that e2e points at it, and e2e's own
    # helpers (defaultCommunity, categoryWithListings) pick "some real
    # category with listings" — which can land on a temporary row one of
    # them creates and deletes mid-test (e.g. cache-roundtrip's "Cache
    # Round-trip Seed" fixture), failing when it vanishes underneath the
    # assertion. Same underlying class of bug as 03c2e99 and the admin-write/
    # cache-roundtrip race above; running after all three removes it the
    # same way.
    needs: [unit, cache-roundtrip, form-roundtrip, admin-write]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only the two engines the config actually uses (Desktop Chrome + Pixel 7
      # device emulation are both Chromium) — no `playwright install` step
      # needed, see container image above. It ships every engine, but we
      # only invoke Chromium via test:e2e.
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SUPERADMIN_EMAILS: ${{ secrets.SUPERADMIN_EMAILS }}
          INBOX_EMAILS: ${{ secrets.INBOX_EMAILS }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  e2e-prod-smoke:
    name: End-to-end tests (production, non-blocking)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPERADMIN_EMAILS: ${{ secrets.SUPERADMIN_EMAILS }}
          INBOX_EMAILS: ${{ secrets.INBOX_EMAILS }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-prod-smoke
          path: playwright-report/
          retention-days: 14
