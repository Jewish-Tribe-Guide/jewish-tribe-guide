name: CI

# Runs the whole test suite automatically instead of relying on someone
# remembering to. `unit` needs no secrets (lint/typecheck/vitest are all pure
# — no network, no DB). `integration`, `cache-roundtrip`, `form-roundtrip`,
# `admin-write` and `e2e` each start a Supabase of their own on the runner,
# loaded from the committed seed (.github/actions/own-test-database; see
# below), so they need no secrets for a database either.
#
# `all-checks` passes only when every one of them did, and it is the check
# `main` requires (docs/checks.md): one name to require, not seven e2e
# shards, and a suite added later is covered once it is in its `needs`
# (ciWorkflow.test.ts fails if it isn't).
#
# `e2e` used to point at the real production project instead — reasoning
# being it's read-only, so no harm done. In practice that made every PR's
# required check depend on production's CURRENT data/config, not just on the
# PR's own code: a branch that added new admin-configurable content (new
# home-screen card kinds) failed `e2e` in CI for weeks even though the code
# was correct, because production's `home_section` rows hadn't been migrated
# to match yet — and the fix that unblocked it was a manual production
# database write made specifically to satisfy CI, the reverse of this repo's
# own "deploy code first, then migrate content" order (see AGENTS.md
# "Ordering"). A required check's pass/fail should trace back to the PR's
# own code, not to a shared, mutable, externally-changing thing.
#
# `e2e-prod-smoke` is the same suite against the real production project,
# kept for the genuinely useful part of that idea — catching prod
# data/config drift — without making it a merge gate: it only runs on push
# to `main` (i.e. after a merge, not as part of one) and every step is
# `continue-on-error`, so it never blocks anything. A failure opens a GitHub
# issue (or comments on the one already open), assigned to whoever pushed,
# so it reaches someone (`prod-smoke-report`).
#
# Nothing waits on `unit` any more (Oct 19). The suites against the test
# project used to start only once lint, typecheck and the unit tests had
# passed, which put ~4.5 minutes in front of everything else; e2e then waited
# on cache-roundtrip and admin-write and ran for ~10 minutes alone, so a PR
# took ~20 minutes to go green. They all start at once now: a failing unit
# test no longer saves the other jobs' runner time, but this repo is public,
# so runner minutes are free, and a PR's author waits on the slowest path,
# not the total. e2e is sharded for the same reason (see its job).
#
# Every job below sets timeout-minutes, well above its normal run time (a
# few minutes) but far under GitHub's 360-minute default — nothing should
# silently eat a runner-hour (or make cancelling it someone's job to
# notice) if something does hang.
#
# `cache-roundtrip`, `form-roundtrip`, `admin-write` and `e2e` all drive a
# real browser, and used to run `npx playwright install --with-deps chromium` on the bare
# runner. That repeatedly hung for 20+ minutes, then 1+ hour, then hit the
# 15-minute timeout outright, always stuck in `apt-get update` endlessly
# retrying an unreachable azure.archive.ubuntu.com mirror before falling
# back to the real one — a GitHub-hosted-runner networking flake. They now
# run inside Playwright's own Docker image (browsers + OS deps
# preinstalled, version-matched to package.json's @playwright/test), so no
# apt-get ever runs in CI and that mirror can't be hit. Keep the image tag
# in sync with @playwright/test's version in package.json.
#
# Each test suite starts a database of its own on its runner (Nov 23,
# .github/actions/own-test-database), so two runs of a suite, on any
# branches, never meet. Until then they shared one hosted test project and queued
# repo-wide (`test-db-<suite>` groups) so two copies didn't rename the same
# fixture (PR 400, Nov 19).
#
# They don't run on push to main. main requires a branch to be up to
# date before merging, so the tree a push to main builds is the tree its
# PR already passed these suites on. `unit` still runs there, and `e2e-prod-smoke`.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run typecheck
      # Unused files, exports and dependencies (knip.json). Clean since Nov 20,
      # so anything it finds is new.
      - run: npm run knip
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration:
    name: Integration tests (real Supabase reads/writes)
    # Its own database, as admin-write (see that job): Supabase started on
    # this runner with the tests' starting data, so it neither queues nor
    # shares the test project with the other jobs. No browser: the tests
    # run on the runner itself.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/own-test-database
      - run: npm run test:integration

  cache-roundtrip:
    name: Cache round-trip (admin save reaches the cached page)
    # Its own database, as admin-write (see that job): Supabase started on
    # this runner with the tests' starting data, so it neither queues nor
    # shares the test project with the other jobs.
    # A bare runner for Docker; the suite runs in the Playwright image, as
    # its "tab picks up an admin edit" test needs a real browser.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-dist-dir: .next-e2e-3211
      - uses: ./.github/actions/own-test-database
      - run: >-
          docker run --rm --network host --ipc host -v "$PWD:/work" -w /work
          -e CI -e TEST_DB_URL -e TEST_DB_ANON_KEY -e TEST_DB_SERVICE_ROLE_KEY
          mcr.microsoft.com/playwright:v1.63.0-noble npm run test:cache-roundtrip
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-cache
          path: playwright-report-cache/
          retention-days: 14

  form-roundtrip:
    name: Form submission (wizard reaches the database)
    # Its own database, as admin-write (see that job): Supabase started on
    # this runner with the tests' starting data, so it neither queues nor
    # shares the test project with the other jobs. The test server adds the
    # form it fills in (scripts/run-test-project-server.mjs).
    # A bare runner for Docker; the suite runs in the Playwright image, as
    # it fills in and submits the wizard in a real browser.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-dist-dir: .next-e2e-3212
      - uses: ./.github/actions/own-test-database
      - run: >-
          docker run --rm --network host --ipc host -v "$PWD:/work" -w /work
          -e CI -e TEST_DB_URL -e TEST_DB_ANON_KEY -e TEST_DB_SERVICE_ROLE_KEY
          mcr.microsoft.com/playwright:v1.63.0-noble npm run test:form-roundtrip
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-form
          path: playwright-report-form/
          retention-days: 14

  admin-write:
    name: Admin console write behavior (approve/reject via the real UI)
    # Its own database (Nov 23): Supabase started on this runner from
    # supabase/migrations with the tests' starting data, supabase/seed
    # (.github/actions/own-test-database). Nothing else touches it, so it
    # neither queues behind another run nor shares the test project's
    # sign-in with the other jobs (3-4s a check there, Nov 23), and it
    # needs none of the test project's keys. A bare runner, for Docker.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-dist-dir: .next-e2e-3213
      - uses: ./.github/actions/own-test-database
      # In the Playwright image the other jobs use, on the runner's network
      # so it reaches the local Supabase. Installing the browser here
      # instead took 4m46s on Nov 23, 4 minutes of it a slow Ubuntu mirror.
      - run: >-
          docker run --rm --network host --ipc host -v "$PWD:/work" -w /work
          -e CI -e TEST_DB_URL -e TEST_DB_ANON_KEY -e TEST_DB_SERVICE_ROLE_KEY
          mcr.microsoft.com/playwright:v1.63.0-noble npm run test:admin-write
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-admin-write
          path: playwright-report-admin-write/
          retention-days: 14

  e2e-build:
    name: Build for the end-to-end tests
    # The app, built once for every e2e shard, which start it rather than
    # each building their own (Nov 20): one artifact tested, not seven
    # identical builds. Built in the shards' Playwright image, at the same
    # path (/work), so the build's paths are the paths they run it at.
    #
    # Its own database, as admin-write (see that job): Supabase started on
    # this runner and loaded with the tests' starting data, which the
    # build prerenders. Each shard starts its own from the same seed, and
    # a local Supabase always has the same address and keys, so the
    # address and key fixed into the build are each shard's too.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The shards reuse these (env: *e2e-env), so what they test is what
    # was built: NEXT_PUBLIC_ values are fixed into the build. The
    # database's come from own-test-database (the step after it).
    env: &e2e-env
      SUPERADMIN_EMAILS: ${{ secrets.SUPERADMIN_EMAILS }}
      INBOX_EMAILS: ${{ secrets.INBOX_EMAILS }}
      # Cloudflare's published always-passes Turnstile test key (not a
      # secret). Without any site key the widget renders nothing, so
      # e2e/budgets.spec.ts's "browsing loads nothing from Turnstile" check
      # could never fail in CI — it would skip. NEXT_PUBLIC_, so it has to be
      # present at build time.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # The site's own Maps key, so the desktop map is tested drawing a
      # real map (budgets.spec.ts, csp.spec.ts) rather than its "couldn't
      # load" message. NEXT_PUBLIC_, so it's in the page anyway; it's a
      # secret only to keep it out of the repo. Locally .env.local has it.
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
      # The seed's photos are the dev project's uploads, still served from
      # there; this lets the image rules treat them as ours (resized, as
      # on the live site) though the database is local (imageHosts.ts).
      NEXT_PUBLIC_SUPABASE_STORAGE_URL: https://lzkulpwawxneelhwvych.supabase.co
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-dist-dir: .next
      - uses: ./.github/actions/own-test-database
      - run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$TEST_DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$TEST_DB_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$TEST_DB_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      # pipefail, so a failed build still fails here. Then the log is
      # checked for Next's prerender stops our code caught and logged as
      # errors (scripts/buildLog.mjs).
      - run: >-
          docker run --rm --network host --ipc host -v "$PWD:/work" -w /work
          -e CI -e NEXT_PUBLIC_SUPABASE_URL -e NEXT_PUBLIC_SUPABASE_ANON_KEY -e SUPABASE_SERVICE_ROLE_KEY
          -e SUPERADMIN_EMAILS -e INBOX_EMAILS -e NEXT_PUBLIC_TURNSTILE_SITE_KEY
          -e NEXT_PUBLIC_GOOGLE_MAPS_API_KEY -e NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID -e NEXT_PUBLIC_SUPABASE_STORAGE_URL
          mcr.microsoft.com/playwright:v1.63.0-noble
          bash -o pipefail -c 'npm run build 2>&1 | tee build.log'
      - run: node scripts/buildLog.mjs build.log
      # Not .next/cache: the shards only start the build, and it's the
      # setup action's cache, kept apart from the artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-build
          path: |
            .next/
            !.next/cache/
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: End-to-end tests (${{ matrix.shard }}/7)
    # Each shard has its own database, loaded from the same seed as the
    # build's (see e2e-build), so it neither queues nor shares one with
    # any other job. e2e itself never writes (AGENTS.md).
    #
    # Split seven ways (four until Nov 20, then six; the seventh took the
    # slowest shard's 168s of tests down), each shard on its own runner
    # (Oct 19). Playwright splits by test count, not time, and a skipped
    # test counts. The suite runs one test at a time per runner
    # (playwright.config.ts's `workers` — a 4-vCPU runner shared with the
    # server and Chromium flaked with more), so on one runner it took ~10
    # minutes. Each shard starts the one build e2e-build made and runs the
    # `warmup` project first; Playwright puts a dependency project in
    # every shard whose tests need it. Public repo: the extra runners are free.
    needs: [e2e-build]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    # The same settings the build had (the anchor on e2e-build).
    env: *e2e-env
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: e2e-build
          path: .next
      - uses: ./.github/actions/own-test-database
      - run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$TEST_DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$TEST_DB_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$TEST_DB_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: >-
          docker run --rm --network host --ipc host -v "$PWD:/work" -w /work
          -e CI -e E2E_SEEDED=1 -e E2E_PREBUILT=1
          -e NEXT_PUBLIC_SUPABASE_URL -e NEXT_PUBLIC_SUPABASE_ANON_KEY -e SUPABASE_SERVICE_ROLE_KEY
          -e SUPERADMIN_EMAILS -e INBOX_EMAILS -e NEXT_PUBLIC_TURNSTILE_SITE_KEY
          -e NEXT_PUBLIC_GOOGLE_MAPS_API_KEY -e NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID -e NEXT_PUBLIC_SUPABASE_STORAGE_URL
          mcr.microsoft.com/playwright:v1.63.0-noble
          npm run test:e2e -- --shard=${{ matrix.shard }}/7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  e2e-prod-build:
    name: Build for the production smoke tests
    # The same suite against real production, after a merge, never gating
    # one (see the header). It ran on one runner, one test at a time, and
    # by Nov 16 needed 13-15 minutes for its 582 tests: the 15-minute
    # timeout cancelled it on most pushes to main, so it reported nothing.
    # Built once and split like e2e's (Nov 20).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    needs: unit
    timeout-minutes: 15
    env: &prod-env
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPERADMIN_EMAILS: ${{ secrets.SUPERADMIN_EMAILS }}
      INBOX_EMAILS: ${{ secrets.INBOX_EMAILS }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
    steps:
      - uses: actions/checkout@v7
      # No build cache: this build has production's values baked in, and
      # its cache would be main's, which every PR's e2e build restores from.
      - uses: ./.github/actions/setup
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-prod-build
          path: |
            .next/
            !.next/cache/
          include-hidden-files: true
          retention-days: 1

  e2e-prod-smoke:
    name: End-to-end tests (production, non-blocking, ${{ matrix.shard }}/6)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    needs: [e2e-prod-build]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env: *prod-env
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: e2e-prod-build
          path: .next
      - id: tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/6
        continue-on-error: true
        env:
          E2E_PREBUILT: '1'
      # continue-on-error leaves failure() false, so the report is kept
      # by the step's own outcome.
      - uses: actions/upload-artifact@v7
        if: steps.tests.outcome == 'failure'
        with:
          name: playwright-report-prod-smoke-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  prod-smoke-report:
    name: Report a production smoke failure
    # Each shard keeps going on a failure (above) and uploads its report
    # only when its tests failed, so a report in this run is the failure.
    if: always() && github.event_name == 'push'
    needs: [e2e-prod-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ACTOR: ${{ github.actor }}
      SHARDS: ${{ needs.e2e-prod-smoke.result }}
    steps:
      - run: |
          failed=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/artifacts" --paginate \
            --jq '.artifacts[].name | select(startswith("playwright-report-prod-smoke-")) | ltrimstr("playwright-report-prod-smoke-")' | sort -n | paste -sd, -)
          if [ -z "$failed" ] && [ "$SHARDS" = success ]; then echo "Production smoke passed."; exit 0; fi
          title="Production smoke tests are failing"
          body="The end-to-end suite against the live site failed after ${GITHUB_SHA::7} (shards: ${failed:-none uploaded a report; the run itself was $SHARDS}). Reports: $RUN"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "$title" --assignee "$ACTOR" --body "$body

          Live data or config no longer fits the code, or the live site is broken. Close this when a push to main passes again (docs/checks.md)." || gh issue create --title "$title" --body "$body"
          fi

  all-checks:
    name: All checks passed
    # The one check main requires (see the header). always(), so a failed
    # or cancelled suite fails this rather than skipping it, which a
    # required check would read as a pass.
    if: always()
    needs: [unit, integration, cache-roundtrip, form-roundtrip, admin-write, e2e-build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              skipped) [ "$EVENT" = push ] || { echo "A suite was skipped on a PR."; exit 1; } ;;
              *) echo "A suite did not pass: $r"; exit 1 ;;
            esac
          done
