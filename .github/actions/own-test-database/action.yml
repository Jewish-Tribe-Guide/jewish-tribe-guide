name: A test database of the job's own
description: >
  Starts Supabase on this runner (database, sign-in and API), built from
  supabase/migrations, loads the tests' starting data (supabase/seed), and
  points TEST_DB_* at it for the rest of the job.

# Why (Nov 23): every suite used to share one hosted test project, with dev,
# the previews and each other. Ten jobs signing in at once took the sign-in
# check from 0.1s to 3-4s, and sharing needed row claims, a queue per suite
# and a hidden community just to keep the suites off each other's rows. A
# database per job is what Supabase's CLI is for: nothing else touches it,
# and it is thrown away with the runner.
#
# The starting data is a file in the repo, the same for every job, not a
# copy of the test project: a copy taken while other jobs wrote to it caught
# the integration suite's half-made page (PR 441, Nov 23). It holds only
# public content, scrubbed (scripts/make-test-seed.mjs). The test server adds
# `e2e-writes` and its fixtures itself. Needs Docker, so the job runs on a
# bare runner, not in a container.

runs:
  using: composite
  steps:
    # The same command a local run uses (scripts/test-db.mjs): starts only
    # what the suites use, loads the seed, moves the id counters and dates.
    - shell: bash
      run: node scripts/test-db.mjs

    - shell: bash
      run: |
        eval "$(npx -y supabase@3.1.0 status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
        {
          echo "TEST_DB_URL=$API_URL"
          echo "TEST_DB_ANON_KEY=$ANON_KEY"
          echo "TEST_DB_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
        } >> "$GITHUB_ENV"
