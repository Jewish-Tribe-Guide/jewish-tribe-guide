name: A test database of the job's own
description: >
  Starts Supabase on this runner (database, sign-in and API), built from
  supabase/migrations, fills it with a copy of the test project's rows, and
  points TEST_SUPABASE_* at it for the rest of the job.

# Why (Nov 23): every suite used to share one hosted test project, with dev,
# the previews and each other. Ten jobs signing in at once took the sign-in
# check from 0.1s to 3-4s, and sharing needed row claims, a queue per suite
# and a hidden community just to keep the suites off each other's rows. A
# database per job is what Supabase's CLI is for: nothing else touches it,
# and it is thrown away with the runner.
#
# The test project is only READ here (scripts/backup.mjs, rows only), so the
# job's writes never reach it. Rows that point at nothing (its test
# leftovers) are left out: a fresh database's foreign keys refuse them.
# Needs Docker, so the job runs on a bare runner, not in a container.

inputs:
  test-supabase-url:
    required: true
  test-supabase-service-role-key:
    required: true

runs:
  using: composite
  steps:
    # Only what the suites use: no Studio, Storage, Realtime, email or logs
    # (supabase/config.toml turns them off too, for a local `supabase start`).
    - shell: bash
      run: npx -y supabase@3.1.0 start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

    - shell: bash
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.test-supabase-url }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.test-supabase-service-role-key }}
      run: node scripts/backup.mjs --no-files

    - shell: bash
      run: |
        eval "$(npx -y supabase@3.1.0 status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
        RESTORE_URL="$API_URL" RESTORE_KEY="$SERVICE_ROLE_KEY" \
          node scripts/restore.mjs "$(ls -d backups/dev-* | head -1)" --no-files --replace --skip-broken-links
        rm -rf backups
        # The copy keeps its ids; move the id counters past them.
        docker exec -i supabase_db_jewish-patient-connect psql -q -U postgres -v ON_ERROR_STOP=1 < scripts/reset-sequences.sql
        {
          echo "TEST_SUPABASE_URL=$API_URL"
          echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY"
          echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
        } >> "$GITHUB_ENV"
