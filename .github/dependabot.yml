# Dependabot keeps dependencies patched — it opens PRs when a package has a new
# version or a known security advisory. Security updates are what matter most
# here; grouping the routine version bumps keeps PR noise low.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all routine (non-major) updates instead of many.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Held at 1.63 (PR 402): playwright-core drives @sparticuz/chromium's
      # serverless Chromium for the menu reader on Vercel, which no suite
      # runs, and CI's Playwright container tag must match @playwright/test
      # (ciWorkflow.test.ts). With these in it the group never passed CI.
      # Moved by hand, together, and checked on a preview.
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright-core"
      - dependency-name: "@sparticuz/chromium"
      # Node's types follow .nvmrc, not the newest Node (versionsAgree.test.ts).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
# no-op touch: editing this file makes Dependabot re-check both ecosystems
# immediately instead of waiting for the weekly schedule.
